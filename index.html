<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RECIPE HUB</title>
  </head>

  <body>
    <header>
      <nav>
        <div class="logo-container">
          <i class="bi bi-fork-knife logo"></i>
          <span class="logo-name">RecipeHub</span>
        </div>

        <div class="search-container">
          <button>Search</button>
          <input
            type="text"
            class="search-bar js-search-bar"
            placeholder="Search by a name"
          />
        </div>

        <div class="favorite-meals-container js-favorite-meals-container">
          <button class="favorite-meals js-favorite-meals">
            <i class="bi bi-heart-fill"></i>
            <span>Favorites</span>
          </button>
        </div>
      </nav>

      <div class="categories-container js-categories-container"></div>
    </header>
    <main>
      <section class="food-display-container js-food-container"></section>
      <section class="food-recipe-display js-food-recipe-display"></section>
    </main>
    <footer></footer>
    <script src="./script.js"></script>
  </body>
</html>
